# Python environment for the SkySurfer HIL runtime, managed by uv.
# The venv lives outside Dropbox; always create it through the entry scripts:
#   ./runbridge.command --setup      (macOS)
#   runbridge.cmd --setup            (Windows)
# Running a bare `uv sync` here would create .venv inside Dropbox.
[project]
name = "skysurfer-hil-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "PySide6==6.8.3",
    "pyserial==3.5",
    "pymavlink==2.4.49",
    "numpy==2.0.2",
]

[tool.uv]
package = false
