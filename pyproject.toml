# Python environment of SkySurfer (runtime, tests, SITL and analysis tools), managed by uv.
# Create it through the entry script: ./runbridge --setup  (the venv lives outside the project folder).
[project]
name = "skysurfer"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "pyserial==3.5",
    "pymavlink==2.4.49",
    "numpy==2.0.2",
]

[tool.uv]
package = false
